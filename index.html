        {
          "heading": "Classic automation versus Physical AI",
          "body": "A programmed industrial arm can repeatedly follow predefined trajectories without learned intelligence. Physical AI emphasizes models that infer state, reason about tasks and/or learn action policies grounded in physical interaction. It does not replace safety-critical controls."

          "heading": "Three layers",

function renderCurriculum(){const visible=D.lessons.filter(l=>filter==='all'||l.belt===filter);return `<div class="page-heading"><div class="overline">LEARNING PATH / ${D.lessons.length} LESSONS</div><h1>Course curriculum</h1><p>Build conceptual foundations first, then progress into motion, simulation, learning and real-world systems. All lessons remain open for exploration.</p></div><input id="curriculum-search" class="search" aria-label="Search courses" type="search" placeholder="Search concepts: URDF, safety, ROS 2, VLA…" value="${E(search)}" /><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">All belts</button>${D.belts.map(b=>`<button class="filter ${filter===b.id?'active':''}" data-filter="${b.id}"><i style="background:${b.color};border:1px solid #0002"></i>${E(b.name)}</button>`).join('')}</div><div class="lesson-grid" id="lesson-grid">${visible.map(l=>`<article class="lesson-card" data-filtertext="${E((l.title+' '+l.objectives+' '+BL[l.belt].name).toLowerCase())}"><div class="lesson-meta"><span>${beltMark(l.belt)}${E(BL[l.belt].name.toUpperCase())} · ${E(l.id)}</span><span>◷ ${l.minutes} min</span></div><h3>${E(l.title)}</h3><p>${E(l.objectives)}</p><div class="card-footer"><span class="status-text ${store.completed[l.id]?'status-ok':''}">${store.completed[l.id]?'✓ Check passed':'○ Not yet passed'}</span><button class="button small-btn outline" data-lesson="${l.id}">Study ${icon('arrow')}</button></div></article>`).join('')}</div><div class="empty" id="no-results" style="display:none">No lessons match that search.</div>`;}
function renderBelt(bid){const b=BL[bid], lessons=beltLessons(bid), lab=D.labs[labIndex(bid)], ready=beltCount(bid)===lessons.length;return `<div class="page-heading"><div class="overline">LEVEL ${b.rank} OF 7 · THE ${E(b.theme.toUpperCase())}</div><div style="display:flex;align-items:center;gap:16px;margin:13px 0"><span style="width:64px;height:17px;border-radius:4px;background:${b.color};border:1px solid #0002;flex-shrink:0"></span><h1 style="margin:0">${E(b.name)} belt</h1></div><p>${E(b.tagline)} · ${E(b.duration)} of suggested study time.</p></div>
<div class="metrics" style="margin-bottom:22px"><div class="metric"><div><div class="metric-number">${beltCount(bid)}/${lessons.length}</div><div class="metric-label">Lessons passed</div></div></div><div class="metric"><div><div class="metric-number">${store.examPass[bid]?'PASS':'—'}</div><div class="metric-label">Belt examination</div></div></div><div class="metric"><div><div class="metric-number">${store.labEvidence[bid]?'DONE':'—'}</div><div class="metric-label">Practical evidence declared</div></div></div></div>
<div class="section-head"><div><h2>Learn the discipline</h2><p>Pass each knowledge check before attempting promotion.</p></div></div><div class="lesson-grid">${lessons.map(l=>`<article class="lesson-card"><div class="lesson-meta"><span>${E(l.id)}</span><span>◷ ${l.minutes} min</span></div><h3>${E(l.title)}</h3><p>${E(l.objectives)}</p><div class="card-footer"><span class="status-text ${store.completed[l.id]?'status-ok':''}">${store.completed[l.id]?'✓ Check passed':'○ To study'}</span><button class="button small-btn outline" data-lesson="${l.id}">Study ${icon('arrow')}</button></div></article>`).join('')}</div>
<div class="section-head"><div><h2>Promotion test</h2><p>All three conditions are required to earn a belt.</p></div></div><div class="next-panel"><article class="panel"><div class="overline">KNOWLEDGE</div><h3 style="margin-top:9px">${E(b.name)} belt exam</h3><p class="muted" style="font-size:12px">${D.exams[bid].questions.length} questions · at least ${D.exams[bid].passing} correct (${D.exams[bid].passPercent}%). Knowledge checks should be passed first; exam completion is recorded separately.</p><button class="button ${store.examPass[bid]?'dark':'primary'}" data-exam="${bid}">${store.examPass[bid]?'Retake exam':'Take belt exam'} ${icon('arrow')}</button></article><article class="panel"><div class="overline">PRACTICE</div><h3 style="margin-top:9px">${E(lab.name)}</h3><p class="muted" style="font-size:12px">${E(lab.brief)}</p><button class="button outline" data-labjump="${bid}">Open practical assignment ${icon('arrow')}</button></article></div>
<div class="notice">${beltEarned(bid)?'<b>Promotion recorded.</b> All checks are complete. This is a self-assessed learning milestone, not professional certification.':`<b>Promotion requirements:</b> ${lessons.length} lesson checks (${beltCount(bid)}/${lessons.length}), an exam score ≥${D.exams[bid].passPercent}% (${store.examPass[bid]?'passed':'pending'}), and an explicitly declared completed practical deliverable (${store.labEvidence[bid]?'complete':'pending'}).`}</div>`;}
function renderLabs(){return `<div class="page-heading"><div class="overline">HANDS-ON / SEVEN ASSIGNMENTS</div><h1>Practice labs</h1><p>Build real engineering intuition. All work can begin with paper, Python, public datasets or simulation; physical hardware is not required to learn the concepts.</p></div>
<section class="panel" style="margin-bottom:24px"><div class="overline">INTERACTIVE MINI-SIMULATION / ORANGE BELT</div><h3 style="font-size:20px;margin:10px 0 6px">Two-link robot arm · forward kinematics</h3><p class="muted" style="font-size:12px">Adjust both joint angles to see how different configurations place the end effector. Link lengths are fixed at 1.00 m and 0.75 m. This is a geometric teaching model, not a dynamics simulator.</p><div class="joint-playground"><div class="joint-canvas"><svg id="armViz" viewBox="0 0 390 245" role="img" aria-label="Interactive two-joint planar robot arm"></svg></div><div><div class="range-row"><label for="angle1">Shoulder q₁ <b id="q1read">${angle1}°</b></label><input id="angle1" type="range" min="-180" max="180" step="1" value="${angle1}"/></div><div class="range-row"><label for="angle2">Elbow q₂ <b id="q2read">${angle2}°</b></label><input id="angle2" type="range" min="-180" max="180" step="1" value="${angle2}"/></div><div class="joint-readout" id="xyread"></div><p class="mini-note">x = L₁ cos(q₁) + L₂ cos(q₁+q₂)<br/>y = L₁ sin(q₁) + L₂ sin(q₁+q₂)</p></div></div></section>
<div class="lab-grid">${D.labs.map((lab,i)=>{const b=BL[lab.belt],steps=store.labSteps[lab.belt]||{};let count=lab.steps.filter((_,idx)=>steps[idx]).length;return `<article class="lab-card" id="lab-${lab.belt}"><div class="lesson-meta"><span>${beltMark(lab.belt)}${E(b.name.toUpperCase())} BELT</span><span>◷ ${E(lab.duration)}</span></div><h3>${E(lab.name)}</h3><p>${E(lab.brief)}</p><div class="lab-progress">${count}/${lab.steps.length} checkpoints prepared</div><div class="lab-steps">${lab.steps.map((step,ix)=>`<label class="lab-step"><input type="checkbox" data-labstep="${lab.belt}:${ix}" ${steps[ix]?'checked':''}/><span>${E(step)}</span></label>`).join('')}</div><div class="lab-deliverable"><b>Deliverable</b>: ${E(lab.deliverable)}<br/><b>Acceptance criterion</b>: ${E(lab.criteria)}</div><div class="lab-cert"><label><input type="checkbox" data-evidence="${lab.belt}" ${store.labEvidence[lab.belt]?'checked':''} ${count!==lab.steps.length?'disabled':''}/><span>I have actually completed this deliverable and checked it against the acceptance criterion <span class="muted">(self-declaration)</span>.</span></label></div></article>`}).join('')}</div>`;}
function renderGlossary(){return `<div class="page-heading"><div class="overline">KNOWLEDGE REFERENCE / ${D.glossary.length} TERMS</div><h1>Robotics glossary</h1><p>Short, engineering-focused definitions. Search while studying a lesson or when preparing a technical review.</p></div><input class="search" id="term-search" type="search" placeholder="Search URDF, kinematics, policy, PPR…" aria-label="Search glossary"/><div class="section-head"><div><h2>Terms and definitions</h2></div></div><div class="glossary-grid" id="glossary-grid">${D.glossary.map(g=>`<article class="term" data-filtertext="${E((g.term+' '+g.definition).toLowerCase())}"><strong>${E(g.term)}</strong><p>${E(g.definition)}</p></article>`).join('')}</div><div class="empty" id="no-results" style="display:none">No matching terms.</div>`;}
function renderSources(){return `<div class="page-heading"><div class="overline">EVIDENCE / PRIMARY REFERENCES</div><h1>Verified learning sources</h1><p>Curated links to institutional teaching, official software documentation and original research. Links were inspected for this academy on 1 November 2026; online documentation can subsequently change.</p></div><div class="source-grid">${D.sources.map(s=>`<article class="source-card"><h3>${E(s.name)}</h3><div class="source-org">${E(s.org)}</div><p>${E(s.about)}</p>${s.url?`<a href="${E(s.url)}" target="_blank" rel="noopener noreferrer" class="small">Visit source ↗</a>`:'<span class="muted small">See linked documentation</span>'}</article>`).join('')}</div><div class="notice"><b>Evidence standard:</b> Vendor pages are references to capabilities and claims, not independent proof of performance. A successful interface prototype validates only the operations it actually tests; robot placement, motion simulation and integrated safety must each be verified separately.</div>`;}
function renderSettings(){
 const isMember=!!member.state.user;
 const stat=member.state;
 const header=`<div class="page-heading"><div class="overline">FREE MEMBERSHIP · PRIVATE LEARNING RECORD</div><h1>${isMember?'My academy account':'Become a free member'}</h1><p>Every lesson, examination and robotics resource remains free to everyone. A free account is required only to save and synchronize your progress across devices.</p></div>`;
 const auth=isMember?
 `<article class="panel"><div class="overline">SIGNED IN</div><h3>Welcome to your Academy</h3><p>Signed in as <b>${E(stat.user.email||'Academy member')}</b>.</p><p>Your progress is saved privately in Supabase and belongs to this account. Only you can access it through the academy.</p><div class="settings-actions"><button class="button outline" data-member-signout="1">Sign out</button></div>${legacyProgress?`<div class="notice" style="margin-top:18px"><b>Previous browser progress found.</b> If it belongs to you, you can import it into this account. Importing will replace your current cloud progress.<br/><button class="button small-btn outline" style="margin-top:10px" data-member-legacy="1">Import earlier browser progress</button></div>`:''}</article>`:
 `<article class="panel"><div class="overline">FREE ACCOUNT · NO PAYMENT</div><h3>Sign in or register with email</h3><p>We'll email you a one-time sign-in link. A new account is created automatically if needed.</p><form id="member-email-form" class="member-form"><label for="member-email">Email address</label><input type="email" required autocomplete="email" id="member-email" placeholder="you@example.com" value="${E(stat.pendingEmail||'')}"/><button type="submit" class="button primary">Send sign-in link</button></form>${stat.emailSent?`<div class="notice"><b>Check your inbox.</b> ${E(stat.message)} <form id="member-code-form" class="member-form"><label for="member-code">Verification code (only if included in the email)</label><input id="member-code" inputmode="numeric" pattern="[0-9]{6,8}" autocomplete="one-time-code" placeholder="Email code"/><button class="button outline" type="submit">Verify code</button></form></div>`:''}<div class="settings-actions" style="margin-top:12px"><button class="button outline" data-member-google="1">Continue with Google</button></div><p class="mini-note">Google sign-in requires the Google provider to be enabled in the Supabase project. Email links require the academy's URL to be allowlisted in Supabase Authentication settings.</p></article>`;
 return header+`<div class="settings-grid">${auth}
 <article class="panel"><h3>Learning record</h3><p>${isMember?'Your saved progress is synchronized to your private account.':'You are browsing as a visitor. Progress is temporary and is not saved after leaving or refreshing the page.'}</p><p>Lesson checks: <b>${numDone()} / ${D.lessons.length}</b>. Belt examinations: <b>${Object.values(store.examPass).filter(Boolean).length} / 7</b>. Practical assignments: <b>${D.labs.filter(x=>store.labEvidence[x.belt]).length} / 7</b>. Earned belts: <b>${earnedCount()} / 7</b>.</p><div class="progress" style="margin:15px 0"><span style="width:${pct(numDone(),D.lessons.length)}%"></span></div>${isMember?`<div class="settings-actions"><button class="button primary" data-export="1">Export my progress JSON</button><button class="button outline" data-import="1">Import progress JSON</button><input type="file" id="importfile" accept=".json,application/json" hidden/></div>`:''}</article>
 <article class="panel"><h3>How belts are awarded</h3><p>Every belt requires ten lesson checks, a 5–20 question exam with its passing threshold, and completion of the practical assignment. Practical evidence is self-declared and does not constitute independent certification.</p></article>
 ${isMember?`<article class="panel"><h3>Privacy and deletion</h3><p>Only you can read or change your learning records. You can export or permanently erase your saved progress and training runs. This does not delete your sign-in account.</p><button class="button danger" data-member-delete="1">Delete all my saved learning data</button></article>`:''}
 </div>${stat.error?`<div class="notice" role="alert"><b>Account issue:</b> ${E(stat.error)}</div>`:''}${stat.message&&!stat.emailSent?`<div class="notice" role="status">${E(stat.message)}</div>`:''}`;
}

function render(){const pages={overview:renderOverview,curriculum:renderCurriculum,labs:renderLabs,glossary:renderGlossary,sources:renderSources,settings:renderSettings};$$('app').innerHTML=shell((pages[view]||renderOverview)());if(modal)drawModal(); if(view==='labs')drawArm();if(view==='curriculum')applySearch('lesson-grid',search);}
const filterCards=(grid,text)=>{let matches=0;document.querySelectorAll('#'+grid+' [data-filtertext]').forEach(el=>{const shown=el.dataset.filtertext.includes(text.trim().toLowerCase());el.style.display=shown?'':'none';if(shown)matches++;});const n=$$('no-results');if(n)n.style.display=matches?'none':'block';};
const applySearch=(grid,text)=>filterCards(grid,text);
function openLesson(id){const l=D.lessons.find(x=>x.id===id);if(!l)return;modal={type:'lesson',id};quizChoice=null;quizFeedback=null;store.lastLesson=id;save();drawModal();}
function lessonBody(l){const b=BL[l.belt], passed=!!store.completed[l.id];return `<div class="overlay" data-overlay="1"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(l.title)}"><div class="modal-head"><button class="close" data-close="1" aria-label="Close lesson">×</button><div class="overline">${E(b.name.toUpperCase())} BELT · ${E(l.id)} · ${l.minutes} MIN</div><h2>${E(l.title)}</h2><p>${E(l.objectives)}</p><span style="display:inline-block;margin-top:9px;background:${b.color};width:76px;height:8px;border-radius:3px"></span></div><div class="modal-content"><div class="lesson-objective"><b>Learning goal:</b> ${E(l.objectives)}</div>${l.blocks.map((x,i)=>`<section class="lesson-section"><div class="overline">0${i+1} / CONCEPT</div><h3>${E(x.heading)}</h3><p>${E(x.body)}</p></section>`).join('')}${l.code?`<h3 style="margin:23px 0 10px">Inspect the model</h3><pre class="code-sample"><code>${E(l.code)}</code></pre>`:''}<div class="explain-box"><strong>ENGINEERING EXAMPLE</strong><p>${E(l.example)}</p></div><div class="explain-box caution"><strong>WATCH OUT / COMMON MISCONCEPTION</strong><p>${E(l.trap)}</p></div><div class="explain-box"><strong>YOUR PRACTICAL EXERCISE</strong><p>${E(l.task)}</p></div><h4 style="margin-top:28px">Go deeper</h4><div class="refs">${l.refs.map(s=>SR[s]?(SR[s].url?`<a class="ref-link" href="${E(SR[s].url)}" target="_blank" rel="noopener noreferrer">${E(SR[s].name)} ↗</a>`:`<span class="ref-link">${E(SR[s].name)}</span>`):'').join('')}</div><div class="quiz-box"><div class="overline">KNOWLEDGE CHECK ${passed?'· ALREADY PASSED':''}</div><h3>Can you explain it?</h3><div class="quiz-question">${E(l.question)}</div>${l.options.map((o,i)=>`<label class="answer-option ${quizChoice===i?'selected':''}"><input type="radio" name="lesson-choice" value="${i}" data-lessonchoice="${i}" ${quizChoice===i?'checked':''}/>${E(o)}</label>`).join('')}${quizFeedback?`<div class="answer-result ${quizFeedback.ok?'':'fail'}"><b>${quizFeedback.ok?'Correct — lesson check passed.':'Not quite — try again.'}</b> ${E(l.why)}</div>`:''}<div class="quiz-actions"><button class="button primary" data-checklesson="${l.id}" ${quizChoice===null?'disabled':''}>${passed?'Check again':'Check answer'} ${icon('check')}</button>${passed?`<button class="button outline" style="margin-left:8px" data-belt="${l.belt}">Back to belt ${icon('arrow')}</button>`:''}</div></div></div></section></div>`;}
function examBody(bid){const b=BL[bid],exam=D.exams[bid],answers=examChoice[bid]||{};return `<div class="overlay" data-overlay="1"><section class="modal" role="dialog" aria-modal="true" aria-label="${E(b.name)} belt examination"><div class="modal-head"><button class="close" data-close="1" aria-label="Close examination">×</button><div class="overline">PROMOTION EXAM · ${E(b.name.toUpperCase())} BELT</div><h2>Show what you understand.</h2><p>${exam.questions.length} questions. ${exam.passing} correct answers (${exam.passPercent}%) are required to pass. No time pressure; focus on sound engineering reasoning.</p></div><div class="modal-content"><div class="notice"><b>Progress:</b> ${beltCount(bid)} / ${beltLessons(bid).length} lessons checked. The exam can be explored at any time; promotion also requires all lesson checks and your practical assignment.</div>${exam.questions.map((q,qi)=>`<section class="exam-question"><div class="overline">QUESTION ${qi+1} OF ${exam.questions.length}</div><div class="quiz-question">${E(q.question)}</div>${q.options.map((o,j)=>`<label class="answer-option ${answers[qi]===j?'selected':''}"><input type="radio" name="exam${qi}" data-examchoice="${bid}:${qi}:${j}" ${answers[qi]===j?'checked':''}/>${E(o)}</label>`).join('')}</section>`).join('')}<div class="exam-footer">${examFeedback?`<div class="answer-result ${examFeedback.passed?'':'fail'}"><b>${examFeedback.passed?'Exam passed!':'Review and retry.'}</b> Score: ${examFeedback.score}/${exam.questions.length} (${Math.round(100*examFeedback.score/exam.questions.length)}%). ${examFeedback.passed?'Your result is recorded.':'You need ${exam.passing}/${exam.questions.length} correct to pass.'}<div style="margin-top:9px">${examFeedback.mistakes.map(x=>`<div>Q${x.q}: ${E(x.why)}</div>`).join('')}</div></div>`:''}<button class="button primary" data-submitexam="${bid}" ${Object.keys(answers).length!==exam.questions.length?'disabled':''}>Submit examination ${icon('arrow')}</button></div></div></section></div>`;}
function drawModal(){if(!modal){document.querySelector('#modalhost')?.remove();return;}let old=$$('modalhost');const previousScroll=old?.querySelector('.modal-content')?.scrollTop||0;if(old)old.remove();let host=document.createElement('div');host.id='modalhost';host.innerHTML=modal.type==='lesson'?lessonBody(D.lessons.find(l=>l.id===modal.id)):examBody(modal.id);document.body.appendChild(host);document.body.style.overflow='hidden';const pane=host.querySelector('.modal-content');if(pane)pane.scrollTop=previousScroll;}
function closeModal(){modal=null;document.querySelector('#modalhost')?.remove();document.body.style.overflow='';render();}
function navigate(newView){modal=null;document.querySelector('#modalhost')?.remove();document.body.style.overflow='';view=newView;render();window.scrollTo({top:0,behavior:'smooth'});}
function drawArm(){const svg=$$('armViz');if(!svg)return;const r1=angle1*Math.PI/180,r2=(angle1+angle2)*Math.PI/180;const x1=1*Math.cos(r1),y1=1*Math.sin(r1),x2=x1+.75*Math.cos(r2),y2=y1+.75*Math.sin(r2),scale=87,base=[195,126],p1=[base[0]+x1*scale,base[1]-y1*scale],p2=[base[0]+x2*scale,base[1]-y2*scale];const xy=p=>p.map(n=>n.toFixed(1)).join(',');svg.innerHTML=`<defs><pattern id="pgrid" width="20" height="20" patternUnits="userSpaceOnUse"><path d="M20 0H0V20" fill="none" stroke="#d5e4f0" stroke-width=".7"/></pattern></defs><rect width="390" height="245" fill="url(#pgrid)"/><path d="M15 126H375M195 15V232" stroke="#b2c9db" stroke-dasharray="4 6"/><circle cx="195" cy="126" r="87" stroke="#6ab0dc" opacity=".25" stroke-width="1" fill="none"/><circle cx="195" cy="126" r="152" stroke="#6ab0dc" opacity=".25" stroke-width="1" fill="none"/><path d="M${xy(base)}L${xy(p1)}" stroke="#2c80bf" stroke-width="16" stroke-linecap="round"/><path d="M${xy(p1)}L${xy(p2)}" stroke="#2cbcb5" stroke-width="12" stroke-linecap="round"/><circle cx="${base[0]}" cy="${base[1]}" r="12" fill="#153d65" stroke="#79bbdb" stroke-width="3"/><circle cx="${p1[0]}" cy="${p1[1]}" r="10" fill="#17496f" stroke="#a2e7ea" stroke-width="3"/><circle cx="${p2[0]}" cy="${p2[1]}" r="7" fill="#ef8c59" stroke="#fff" stroke-width="3"/><g font-family="sans-serif" font-size="11" fill="#1e5275"><text x="201" y="149">base</text><text x="${p1[0]+11}" y="${p1[1]-9}">elbow</text><text x="${p2[0]+10}" y="${p2[1]-8}">TCP</text></g>`;$$('q1read').textContent=angle1+'°';$$('q2read').textContent=angle2+'°';$$('xyread').textContent=`TCP → x = ${x2.toFixed(3)} m, y = ${y2.toFixed(3)} m`;}
function exportProgress(){const blob=new Blob([JSON.stringify({product:'Physical AI Academy',savedAt:new Date().toISOString(),progress:store},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='physical-ai-academy-progress.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Progress JSON downloaded.');}
function resetProgress(){if(!member.state.user){notify('Sign in to save or reset your learning record.');return;}if(!confirm('Clear your current progress?'))return;store=defaults();save();render();notify('Your progress reset will be synchronized.');}
async function importProgress(file){if(!member.state.user){notify('Sign in to import progress into a private account.');return;}try{const raw=JSON.parse(await file.text());const x=raw.progress||raw;if(!x||![1,2].includes(x.version)||typeof x.completed!=='object'||typeof x.examPass!=='object')throw new Error('Unrecognized academy progress format');store={...defaults(),...x,version:2,examPass:x.version===1?{}:x.examPass,labEvidence:x.version===1?{}:x.labEvidence};save();render();notify('Progress imported. Older belt exams must be retaken with the new questions.');}catch(e){notify('Could not import this JSON: '+e.message);}}
const scrollToLab=bid=>{navigate('labs');setTimeout(()=>$$('lab-'+bid)?.scrollIntoView({behavior:'smooth',block:'center'}),80);};
function setExamChoice(bid,qi,ai){examChoice[bid]=examChoice[bid]||{};examChoice[bid][qi]=ai;examFeedback=null;drawModal();}
function submitExam(bid){const ex=D.exams[bid],responses=examChoice[bid]||{};if(Object.keys(responses).length!==ex.questions.length)return;const score=ex.questions.filter((q,i)=>responses[i]===q.answer).length,passed=score>=ex.passing; if(passed){store.examPass[bid]=true;save();}examFeedback={score,passed,mistakes:ex.questions.map((q,i)=>({q:i+1,why:q.why,correct:responses[i]===q.answer})).filter(x=>!x.correct)};drawModal();if(passed)notify(`${BL[bid].name} exam passed. Complete all requirements to earn the belt.`);}
function quizSelect(i){quizChoice=i;quizFeedback=null;drawModal();}
function checkLesson(id){const l=D.lessons.find(x=>x.id===id);if(!l||quizChoice===null)return;const ok=quizChoice===l.answer;quizFeedback={ok};if(ok){store.completed[id]=true;save();notify(`${l.title}: knowledge check passed.`);}drawModal();}
function handleClick(e){const b=e.target.closest('button,[data-menuclose]');if(!b){if(e.target.matches('.overlay'))closeModal();return;}if(b.dataset.menu){$$('sidebar')?.classList.add('mobile-open');$$('nav-shade')?.classList.add('visible');return;}if(b.dataset.menuclose){$$('sidebar')?.classList.remove('mobile-open');$$('nav-shade')?.classList.remove('visible');return;}if(b.dataset.close){closeModal();return;}if(b.dataset.view){navigate(b.dataset.view);return;}if(b.dataset.filter){filter=b.dataset.filter;navigate('curriculum');return;}if(b.dataset.lesson){openLesson(b.dataset.lesson);return;}if(b.dataset.belt){navigate('belt:'+b.dataset.belt);return;}if(b.dataset.exam){examChoice[b.dataset.exam]={};examFeedback=null;modal={type:'exam',id:b.dataset.exam};drawModal();return;}if(b.dataset.checklesson){checkLesson(b.dataset.checklesson);return;}if(b.dataset.submitexam){submitExam(b.dataset.submitexam);return;}if(b.dataset.labjump){scrollToLab(b.dataset.labjump);return;}if(b.dataset.memberSignout){member.signOut().catch(member.report);return;}
if(b.dataset.memberGoogle){member.google().catch(member.report);return;}
if(b.dataset.memberLegacy){if(!member.state.user||!legacyProgress)return;if(!confirm('Replace this account\'s existing cloud progress with the progress found in this browser?'))return;store={...defaults(),...legacyProgress};save();render();notify('Previous progress imported into your account.');return;}
if(b.dataset.memberDelete){if(!confirm('Permanently delete your saved progress AND training experiment records? This cannot be undone.'))return;member.deleteProgress().then(()=>{store=defaults();render();notify('Saved progress deleted.');}).catch(member.report);return;}
if(b.dataset.export){if(member.state.user)exportProgress();else notify('Sign in to save your progress.');return;}
if(b.dataset.import){if(member.state.user)$('importfile')?.click();return;}
if(b.dataset.reset){resetProgress();return;}}
const basicRender=render;render=function(){if(view.startsWith('belt:')){const id=view.slice(5);$$('app').innerHTML=shell(renderBelt(id));if(modal)drawModal();}else basicRender();};
document.addEventListener('click',handleClick);
document.addEventListener('submit',e=>{
 if(e.target.id==='member-email-form'){
  e.preventDefault();const email=e.target.querySelector('input[type=email]')?.value?.trim();
  member.requestEmail(email).catch(member.report);return;
 }
 if(e.target.id==='member-code-form'){
  e.preventDefault();const code=e.target.querySelector('#member-code')?.value?.trim();
  member.verifyCode(code).catch(member.report);
 }
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset.lessonchoice!==undefined){quizSelect(Number(t.dataset.lessonchoice));return;}if(t.dataset.examchoice){const [b,qi,a]=t.dataset.examchoice.split(':');setExamChoice(b,+qi,+a);return;}if(t.dataset.labstep){const [b,i]=t.dataset.labstep.split(':');store.labSteps[b]=store.labSteps[b]||{};store.labSteps[b][i]=t.checked;if(!D.labs[labIndex(b)].steps.every((_,j)=>store.labSteps[b][j]))store.labEvidence[b]=false;save();const scroll=window.scrollY;render();window.scrollTo(0,scroll);return;}if(t.dataset.evidence){const bid=t.dataset.evidence;store.labEvidence[bid]=t.checked;save();const scroll=window.scrollY;render();window.scrollTo(0,scroll);if(t.checked)notify(`${BL[bid].name} practical evidence recorded (self-assessed).`);return;}if(t.id==='importfile'&&t.files?.length){importProgress(t.files[0]);return;}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='curriculum-search'){search=t.value;applySearch('lesson-grid',search);}if(t.id==='term-search')applySearch('glossary-grid',t.value);if(t.id==='angle1'){angle1=Number(t.value);drawArm();}if(t.id==='angle2'){angle2=Number(t.value);drawArm();}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();});
render();
member.init(onAccountChange);
})();

</script>
